name: C/C++ CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
    linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6.0.1
            - name: Install Conan
              uses: turtlebrowser/get-conan@main
              with:
                version: 2.34.0
            - name: Configure conan
              run: conan profile detect
            - name: Install deps
              run: conan install . --output-folder=${{github.workspace}}/build --build=missing -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True
            - name: "Configure and build"
              run: cmake -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake -DUSE_CONAN=ON -DCMAKE_BUILD_TYPE=Release -S . -B build
            - name: build
              run: cmake --build build --config Release
            - name: package
              run: cmake --build build --config Release --target package
            - uses: actions/upload-artifact@v4
              with:
                name: ubuntu
                path: build/Li_ri-*.sh
    mac:
        if: ${{ false }} # disable until libmodplug works with recent cmake version
        runs-on: macos-14
        steps:
            - uses: actions/checkout@v6.0.1
            - uses: actions/setup-python@v6.1.0
              with:
                python-version: '3.13'
            - name: Get Conan
              uses: turtlebrowser/get-conan@main
              with:
                version: 2.34.0
            - name: Configure conan
              run: conan profile detect
            - name: Install deps
              run: conan install . --output-folder=${{github.workspace}}/build --build=missing

            - name: "Configure and build"
              run: cmake -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake -DUSE_CONAN=ON -DCMAKE_BUILD_TYPE=Release -S . -B build
            - name: build
              run: cmake --build build --config Release
            - name: package
              run: cmake --build build --config Release --target package
            - uses: actions/upload-artifact@v4
              with:
                name: macOS
                path: build/Li_ri-*.dmg

    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6.0.1
            - name: Install Conan
              uses: turtlebrowser/get-conan@main
              with:
                version: 2.34.0

            - name: Configure conan
              run: conan profile detect
            # Ninja for the dependencies: their recipes build with Conan's CMake 3.31,
            # which has no generator for the runner's Visual Studio 2026 (18).
            - name: Install Ninja
              run: pip install ninja
            - name: Install deps
              run: conan install . --output-folder=${{github.workspace}}/build --build=missing -c tools.cmake.cmaketoolchain:generator=Ninja
            - name: "Configure and build"
              run: cmake -DCMAKE_TOOLCHAIN_FILE="${{github.workspace}}/build/build/Release/generators/conan_toolchain.cmake" -DUSE_CONAN=ON -DCMAKE_BUILD_TYPE=Release -S . -B build

            - name: build
              run: cmake --build build --config Release
            # From Chocolatey: the install-nsis action's SourceForge mirror download
            # arrived corrupted ("The file or directory is corrupted and unreadable").
            - name: Install NSIS
              run: |
                choco install nsis -y --no-progress
                echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
            - name: package
              run: cmake --build build --config Release --target package
            - uses: actions/upload-artifact@v4
              with:
                name: windows
                path: build/Li_ri-*.exe
