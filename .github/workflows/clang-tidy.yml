# Syntax reference https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions
# Environment reference https://help.github.com/en/actions/reference/virtual-environments-for-github-hosted-runners
name: clang-tidy

on:
  push:
    branches:
      - 'main'
  pull_request:

permissions:
  contents: read

jobs:
  build:

    # Pinned: the checks are tuned for clang-tidy 17 (newer releases add checks that
    # fail under WarningsAsErrors), and Ubuntu 24.04 carries clang 17 in its own archive.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6.0.1

      - name: Install missing software
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev

      - name: Install clang
        run: |
          sudo apt-get install -y clang-17 clang-tidy-17

      - name: Verify clang-tidy configuration
        run: |
          clang-tidy-17 --verify-config

      - name: Prepare CMake
        run: |
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        env:
          CC: clang-17
          CXX: clang++-17

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Clang-Tidy
        run: |
          run-clang-tidy-17 -p build
